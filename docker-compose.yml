# Forgeflow — free local development infrastructure
# Run:  docker compose up -d
# Stop: docker compose down
#
# All services here are 100% free and open source.
# For production, use MongoDB Atlas free tier (512 MB) and Grafana Cloud free tier.

version: "3.9"

services:

  # ── MongoDB ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: forgeflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: forgeflow
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mongo Express ─────────────────────────
  mongo-express:
    image: mongo-express:1
    container_name: forgeflow-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Prometheus  ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: forgeflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:latest
    container_name: forgeflow-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: forgeflow
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
